<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#03050f" />
    <meta name="description" content="時區計算：查看所在時區、鎖定任一時區的即時時間、計算時差與換算時間" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2389c2ff'/><stop offset='1' stop-color='%231d3b8f'/></linearGradient></defs><circle cx='32' cy='32' r='28' fill='url(%23g)'/><path d='M32 4a28 28 0 0 1 0 56z' fill='%23020617' opacity='.55'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap"
    />
    <title>時區計算</title>
  </head>
  <body>
    <canvas id="globe" aria-hidden="true"></canvas>

    <div class="app">
      <header class="topbar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="12" />
            <path d="M16 4a12 12 0 0 1 0 24" class="brand-shade" />
            <path d="M16 9v7l4.5 3" class="brand-hand" />
          </svg>
          <div>
            <h1 data-i18n="title"></h1>
            <p class="subtitle" data-i18n="subtitle"></p>
          </div>
        </div>

        <div class="topbar-right">
          <div class="local-chip">
            <span class="chip-label" data-i18n="yourZone"></span>
            <strong id="local-zone"></strong>
            <span class="chip-offset" id="local-offset"></span>
          </div>
          <label class="lang-select">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z" />
            </svg>
            <span class="sr-only" data-i18n="language"></span>
            <select id="lang"></select>
          </label>
        </div>
      </header>

      <main class="layout">
        <!-- 鎖定時區的時鐘 -->
        <section class="panel clock-panel" aria-labelledby="clock-title">
          <div class="panel-head">
            <h2 id="clock-title" data-i18n="lockedZone"></h2>
            <span class="phase-badge" id="phase"></span>
          </div>

          <button type="button" class="zone-btn" id="locked-zone-btn"></button>

          <div class="clock-time" id="clock-time" aria-live="off"></div>
          <div class="clock-date" id="clock-date"></div>

          <div class="clock-actions">
            <button type="button" class="toggle-btn" id="lock-toggle" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-locked">
                <rect x="5" y="10.5" width="14" height="10" rx="2.5" />
                <path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" />
              </svg>
              <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-unlocked">
                <rect x="5" y="10.5" width="14" height="10" rx="2.5" />
                <path d="M8.5 10.5V8a3.5 3.5 0 0 1 6.8-1.2" />
              </svg>
              <span id="lock-label"></span>
            </button>
            <button type="button" class="ghost-btn" id="back-local" data-i18n="backToLocal"></button>
          </div>
          <p class="hint" id="lock-hint"></p>
        </section>

        <!-- 地球所在的區域（地球本身畫在背景 canvas 上） -->
        <div class="globe-stage" id="globe-stage" aria-hidden="true"></div>

        <!-- 時差與換算 -->
        <section class="panel tools-panel" aria-labelledby="tools-title">
          <div class="panel-head">
            <h2 id="tools-title" data-i18n="toolsTitle"></h2>
          </div>

          <div class="tabs" role="tablist">
            <button type="button" role="tab" id="tab-diff" aria-controls="panel-diff" aria-selected="true" data-i18n="tabDiff"></button>
            <button type="button" role="tab" id="tab-convert" aria-controls="panel-convert" aria-selected="false" tabindex="-1" data-i18n="tabConvert"></button>
            <span class="tab-indicator" aria-hidden="true"></span>
          </div>

          <div class="zone-pair">
            <div class="pair-item">
              <span class="pair-label" id="label-a"></span>
              <button type="button" class="zone-btn compact" id="zone-a-btn"></button>
            </div>
            <button type="button" class="swap-btn" id="swap">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v15M4.5 15.5 8 19l3.5-3.5M16 20V5M12.5 8.5 16 5l3.5 3.5" /></svg>
            </button>
            <div class="pair-item">
              <span class="pair-label" id="label-b"></span>
              <button type="button" class="zone-btn compact" id="zone-b-btn"></button>
            </div>
          </div>

          <div role="tabpanel" id="panel-diff" aria-labelledby="tab-diff" class="tab-panel">
            <div class="diff-value" id="diff-value"></div>
            <p class="diff-text" id="diff-text"></p>
            <div class="hour-ruler" id="hour-ruler"></div>
            <p class="note" data-i18n="dstNote"></p>
          </div>

          <div role="tabpanel" id="panel-convert" aria-labelledby="tab-convert" class="tab-panel" hidden>
            <label class="field">
              <span class="field-label" data-i18n="inputTime"></span>
              <span class="input-row">
                <input type="datetime-local" id="convert-input" step="60" />
                <button type="button" class="ghost-btn" id="convert-now" data-i18n="now"></button>
              </span>
            </label>
            <div class="convert-result" aria-live="polite">
              <span class="field-label" data-i18n="result"></span>
              <div class="result-time" id="result-time"></div>
              <div class="result-date">
                <span id="result-date"></span>
                <span class="day-badge" id="result-day" hidden></span>
              </div>
              <div class="result-offsets" id="result-offsets"></div>
            </div>
            <p class="note warn" id="convert-warn" hidden></p>
          </div>
        </section>
      </main>

      <footer class="legend">
        <span class="legend-swatch" aria-hidden="true"></span>
        <span data-i18n="legend"></span>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
