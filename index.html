<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#01020a" />
    <meta name="description" content="時區計算：鎖定世界各地城市，查看當地時間與時差" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2389c2ff'/><stop offset='1' stop-color='%231d3b8f'/></linearGradient></defs><circle cx='32' cy='32' r='28' fill='url(%23g)'/><path d='M32 4a28 28 0 0 1 0 56z' fill='%23020617' opacity='.55'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap"
    />
    <title>時區計算</title>
  </head>
  <body>
    <!-- 地球與背景星空都畫在這個 canvas 上 -->
    <canvas id="globe" aria-hidden="true"></canvas>

    <div class="app">
      <header class="banner" id="banner">
        <section class="slot" id="slot-a" data-slot="0">
          <div class="slot-row">
            <div class="slot-head">
              <button type="button" class="place-btn" id="place-a">
                <span class="place-dot" aria-hidden="true"></span>
                <span class="place-name" id="name-a"></span>
                <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" /></svg>
              </button>
            </div>
            <div class="slot-time" id="time-a"></div>
            <div class="slot-meta">
              <div class="slot-zone" id="zone-a"></div>
              <div class="slot-date"><span id="date-a"></span><span class="phase" id="phase-a"></span></div>
            </div>
          </div>
        </section>

        <div class="link" id="link" aria-live="polite">
          <span class="link-diff" id="link-diff"></span>
          <span class="link-line" aria-hidden="true"></span>
        </div>

        <section class="slot slot-b" id="slot-b" data-slot="1">
          <div class="slot-row" id="body-b">
            <div class="slot-head">
              <button type="button" class="place-btn" id="place-b">
                <span class="place-dot" aria-hidden="true"></span>
                <span class="place-name" id="name-b"></span>
                <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" /></svg>
              </button>
            </div>
            <div class="slot-time" id="time-b"></div>
            <div class="slot-meta">
              <div class="slot-zone" id="zone-b"></div>
              <div class="slot-date"><span id="date-b"></span><span class="phase" id="phase-b"></span></div>
            </div>
          </div>
        </section>
      </header>
    </div>

    <!-- 點地名時出現的城市選單 -->
    <div class="city-menu" id="city-menu" role="dialog" aria-labelledby="city-menu-title" hidden>
      <div class="cm-head">
        <span class="cm-title" id="city-menu-title"></span>
      </div>
      <div class="cm-grid" id="city-grid"></div>
      <button type="button" class="cm-more" id="city-more">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg>
        <span id="city-more-label"></span>
      </button>
    </div>

    <!-- 選單收起後，從頂端往下拉或點一下把選單拉回來 -->
    <!-- 手機：選單收起後，從頂端往下滑一下才出現把手 -->
    <div class="pull-zone" id="pull-zone" aria-hidden="true"></div>
    <button type="button" class="pull" id="pull" tabindex="-1">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" /></svg>
    </button>

    <label class="lang-select">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z" />
      </svg>
      <span class="sr-only" id="lang-label"></span>
      <select id="lang"></select>
    </label>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
